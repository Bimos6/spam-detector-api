services:
  db:
    image: postgres:15-alpine
    container_name: spam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spam_password}
      POSTGRES_DB: ${POSTGRES_DB:-spam_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spam_user} -d ${POSTGRES_DB:-spam_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: spam_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-spam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spam_password}
      POSTGRES_DB: ${POSTGRES_DB:-spam_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data

volumes:
  postgres_data: